<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Expreso</title>
<style>
  :root { --bg: #000; --fg: #f5f5f5; --muted: #8a8a8a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .slide { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; padding: 4vh 4vw; opacity: 0; visibility: hidden; cursor: pointer;
    transition: opacity .35s ease, visibility 0s linear .35s; background: var(--bg); }
  .slide.active { opacity: 1; visibility: visible; transition: opacity .35s ease; }
  body.idle, body.idle .slide { cursor: none; }
  .slide img.full { max-width: 100%; max-height: 92vh; object-fit: contain; display: block; }

  /* Presentaciones incrustadas (copias locales en teimas/ e innogando/, mismo origen) */
  .slide.deck { padding: 0; }
  .slide.deck iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  /* Capa transparente: el foco se queda siempre en esta página y ella decide a dónde va cada paso */
  .catcher { position: absolute; inset: 0; z-index: 2; }

  /* pdepablo */
  .pdp { display: flex; flex-direction: column; align-items: center; gap: 4vh; text-align: center; }
  .pdp .logo { width: clamp(120px, 20vh, 220px); height: auto; border-radius: 28%;
    box-shadow: 0 0 0 1px #222; }
  .pdp .site { font-size: clamp(32px, 6vw, 84px); font-weight: 700; letter-spacing: -.02em;
    color: var(--fg); text-decoration: none; }
  .pdp .socials { display: flex; flex-wrap: wrap; justify-content: center; gap: 2vh 4vw; }
  .pdp .socials a { display: flex; align-items: center; gap: 12px; color: var(--muted);
    text-decoration: none; font-size: clamp(16px, 2.2vw, 28px); }
  .pdp .socials a:hover { color: var(--fg); }
  .pdp .socials svg { width: 1.3em; height: 1.3em; flex: none; }
</style>
</head>
<body>

<!-- 1: negro -->
<section class="slide"></section>

<!-- 2: pdepablo.com -->
<section class="slide">
  <div class="pdp">
    <img class="logo" src="pdepablo.svg?v=2" alt="P de Pablo">
    <a class="site" href="https://pdepablo.com" target="_blank" rel="noopener">pdepablo.com</a>
    <div class="socials">
      <a href="https://instagram.com/pdepablocom" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>
        @pdepablocom</a>
      <a href="https://x.com/pdepablocom" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        @pdepablocom</a>
      <a href="https://linkedin.com/in/pdepablo" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 11v5M8 8v.01M12 16v-5M12 13a2.5 2.5 0 0 1 5 0v3"/></svg>
        /in/pdepablo</a>
    </div>
  </div>
</section>

<!-- 3: Teimas (copia de elizechea.github.io/teimas) -->
<section class="slide deck" data-counter="counter">
  <iframe src="teimas/index.html" title="La transformación de TEIMAS" allow="fullscreen; autoplay"></iframe>
  <div class="catcher"></div>
</section>

<!-- 4: meme -->
<section class="slide"><img class="full" src="meme.webp?v=2" alt="Mi trabajo soñado hace 10 años: Microsoft. Hace 2 años: Anthropic. Ahora: una granja con vacas."></section>

<!-- 5: Innogando (copia de talks.getrus.xyz, sin sincronización con su servidor) -->
<section class="slide deck" data-counter="count">
  <iframe src="innogando/index.html" title="Desde el rural y para el rural · Innogando" allow="fullscreen; autoplay"></iframe>
  <div class="catcher"></div>
</section>

<!-- 6: Barkibu -->
<section class="slide"><img class="full" src="barkibu.webp?v=2" alt="El equipo de Barkibu"></section>

<!-- 7: cierre en negro -->
<section class="slide"></section>

<script>
(function () {
  var slides = [].slice.call(document.querySelectorAll('.slide'));
  var i = 0, idleTimer;

  // ---- Presentaciones incrustadas: se manejan enviándoles teclas y leyendo su contador ("3 / 9") ----
  function Deck(el) {
    var self = this;
    this.frame = el.querySelector('iframe');
    this.counterId = el.dataset.counter;
    this.pending = null; // tecla a enviar en cuanto cargue
    this.frame.addEventListener('load', function () {
      if (self.pending) { var k = self.pending; self.pending = null; self.key(k); }
    });
  }
  Deck.prototype.state = function () {
    try {
      var c = this.frame.contentDocument.getElementById(this.counterId);
      var m = /(\d+)\s*\/\s*(\d+)/.exec(c.textContent);
      return m ? { pos: +m[1] - 1, n: +m[2] } : null;
    } catch (e) { return null; }
  };
  Deck.prototype.key = function (k) {
    var w = this.frame.contentWindow, d = this.frame.contentDocument;
    if (!d || d.readyState !== 'complete' || !this.state()) { this.pending = k; return; }
    d.dispatchEvent(new w.KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
  };

  var decks = slides.map(function (s) { return s.classList.contains('deck') ? new Deck(s) : null; });

  // ---- Navegación (la URL de la página no cambia nunca) ----
  function show(n, fromEnd) {
    var prev = i;
    i = Math.max(0, Math.min(slides.length - 1, n));
    var d = decks[i];
    if (d && i !== prev) d.key(fromEnd ? 'End' : 'Home');
    slides.forEach(function (s, k) { s.classList.toggle('active', k === i); });
  }
  function next() {
    var d = decks[i], st = d && d.state();
    if (st && st.pos < st.n - 1) d.key('ArrowRight');
    else if (i < slides.length - 1) show(i + 1, false);
  }
  function prev() {
    var d = decks[i], st = d && d.state();
    if (st && st.pos > 0) d.key('ArrowLeft');
    else if (i > 0) show(i - 1, true);
  }
  function fullscreen() {
    var de = document.documentElement;
    if (!document.fullscreenElement) { de.requestFullscreen && de.requestFullscreen().catch(function () {}); }
    else document.exitFullscreen();
  }

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].indexOf(k) >= 0) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].indexOf(k) >= 0) { e.preventDefault(); prev(); }
    else if (k === 'Home') { e.preventDefault(); show(0); }
    else if (k === 'End') { e.preventDefault(); show(slides.length - 1); }
    else if (k === 'f' || k === 'F') { e.preventDefault(); fullscreen(); }
  });
  document.addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    if (e.clientX < window.innerWidth / 3) prev(); else next();
  });

  // Táctil: toque (tercio izquierdo atrás, resto adelante) y deslizar.
  // iOS (Safari y Chrome, ambos WebKit) no manda 'click' al tocar fondos o imágenes, así que el toque se detecta aquí.
  var x0 = null, y0 = null;
  document.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0, sx = x0;
    x0 = null;
    if (e.target.closest && e.target.closest('a')) return; // los enlaces se abren
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { e.preventDefault(); if (dx < 0) next(); else prev(); }
    else if (Math.abs(dx) < 15 && Math.abs(dy) < 15) {
      e.preventDefault(); // evita el 'click' duplicado en Android y el zoom por doble toque
      if (sx < window.innerWidth / 3) prev(); else next();
    }
  }, { passive: false });

  // Si el foco se va a un marco, recuperarlo para que las flechas sigan llegando aquí
  window.addEventListener('blur', function () { setTimeout(function () { window.focus(); }, 0); });
  document.addEventListener('mousemove', function () {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 2000);
  });

  show(0);
})();
</script>
</body>
</html>
