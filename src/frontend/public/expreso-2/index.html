<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Expreso</title>
<style>
  :root { --bg: #000; --fg: #f5f5f5; --muted: #8a8a8a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body.idle { cursor: none; }
  .slide { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; padding: 4vh 4vw; opacity: 0; visibility: hidden;
    transition: opacity .35s ease, visibility 0s linear .35s; background: var(--bg); }
  .slide.active { opacity: 1; visibility: visible; transition: opacity .35s ease; }
  .slide img.full { max-width: 100%; max-height: 92vh; object-fit: contain; display: block; }

  /* Presentaciones incrustadas */
  .slide.deck { padding: 0; }
  .slide.deck iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
    background: #000; visibility: hidden; }
  .slide.deck iframe.front { visibility: visible; }
  /* Capa transparente: el foco se queda siempre en esta página y las flechas las gestiona ella */
  .catcher { position: absolute; inset: 0; z-index: 2; }

  /* pdepablo */
  .pdp { display: flex; flex-direction: column; align-items: center; gap: 4vh; text-align: center; }
  .pdp .logo { width: clamp(120px, 20vh, 220px); height: auto; border-radius: 28%;
    box-shadow: 0 0 0 1px #222; }
  .pdp .site { font-size: clamp(32px, 6vw, 84px); font-weight: 700; letter-spacing: -.02em;
    color: var(--fg); text-decoration: none; }
  .pdp .socials { display: flex; flex-wrap: wrap; justify-content: center; gap: 2vh 4vw; }
  .pdp .socials a { display: flex; align-items: center; gap: 12px; color: var(--muted);
    text-decoration: none; font-size: clamp(16px, 2.2vw, 28px); }
  .pdp .socials a:hover { color: var(--fg); }
  .pdp .socials svg { width: 1.3em; height: 1.3em; flex: none; }

  .hud { position: fixed; right: 16px; bottom: 12px; font-size: 13px; color: #555; z-index: 5;
    font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .3s; user-select: none; pointer-events: none; }
  body.show-hud .hud { opacity: 1; }
</style>
</head>
<body>

<!-- 1: negro -->
<section class="slide"></section>

<!-- 2: pdepablo.com -->
<section class="slide">
  <div class="pdp">
    <img class="logo" src="pdepablo.svg" alt="P de Pablo">
    <a class="site" href="https://pdepablo.com" target="_blank" rel="noopener">pdepablo.com</a>
    <div class="socials">
      <a href="https://instagram.com/pdepablocom" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>
        @pdepablocom</a>
      <a href="https://x.com/pdepablocom" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        @pdepablocom</a>
      <a href="https://linkedin.com/in/pdepablo" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 11v5M8 8v.01M12 16v-5M12 13a2.5 2.5 0 0 1 5 0v3"/></svg>
        /in/pdepablo</a>
    </div>
  </div>
</section>

<!-- 3: Teimas (responde a cambios de #N) -->
<section class="slide deck" data-deck="hash" data-src="https://elizechea.github.io/teimas/" data-n="9" data-hash="#{n}">
  <iframe class="front" title="La transformación de TEIMAS" allow="fullscreen; autoplay"></iframe>
  <div class="catcher"></div>
</section>

<!-- 4: meme -->
<section class="slide"><img class="full" src="meme.webp" alt="Mi trabajo soñado hace 10 años: Microsoft. Hace 2 años: Anthropic. Ahora: una granja con vacas."></section>

<!-- 5: Innogando (solo lee #sN al cargar: se recarga en un segundo marco y se intercambia) -->
<section class="slide deck" data-deck="reload" data-src="https://talks.getrus.xyz/3miu6z89x6/" data-n="33" data-hash="#s{n}">
  <iframe class="front" title="Desde el rural y para el rural · Innogando" allow="fullscreen; autoplay"></iframe>
  <iframe title="" aria-hidden="true" allow="fullscreen; autoplay"></iframe>
  <div class="catcher"></div>
</section>

<!-- 6: Barkibu -->
<section class="slide"><img class="full" src="barkibu.webp" alt="El equipo de Barkibu"></section>

<!-- 7: cierre en negro -->
<section class="slide"></section>

<div class="hud" id="hud"></div>

<script>
(function () {
  var slides = [].slice.call(document.querySelectorAll('.slide'));
  var hud = document.getElementById('hud');
  var i = 0, hudTimer, idleTimer;

  // ---- Presentaciones incrustadas ----
  function Deck(el) {
    this.el = el;
    this.kind = el.dataset.deck;
    this.src = el.dataset.src;
    this.n = parseInt(el.dataset.n, 10);
    this.hash = el.dataset.hash;
    this.frames = [].slice.call(el.querySelectorAll('iframe'));
    this.pos = 0;
    this.token = 0;
    var self = this;
    // Carga inicial en la primera diapositiva, para que esté lista al llegar
    this.frames[0].src = this.url(0);
    this.frames[0].dataset.pos = '0';
    if (this.kind === 'reload') {
      this.frames[1].addEventListener('load', function () { self.onLoad(this); });
      this.frames[0].addEventListener('load', function () { self.onLoad(this); });
    }
  }
  Deck.prototype.url = function (p) {
    var h = this.hash.replace('{n}', p + 1);
    if (this.kind === 'reload') return this.src + '?p=' + (p + 1) + '&t=' + Date.now() + h;
    return this.src + h;
  };
  Deck.prototype.front = function () { return this.el.querySelector('iframe.front'); };
  Deck.prototype.set = function (p) {
    p = Math.max(0, Math.min(this.n - 1, p));
    this.pos = p;
    if (this.kind === 'hash') {
      var f = this.frames[0];
      var u = this.url(p);
      try { f.contentWindow.location.replace(u); } catch (e) { f.src = u; }
      return;
    }
    var front = this.front();
    if (front.dataset.pos === String(p) && !front.dataset.loading) return;
    var back = this.frames[0] === front ? this.frames[1] : this.frames[0];
    this.token++;
    back.dataset.token = String(this.token);
    back.dataset.pos = String(p);
    back.dataset.loading = '1';
    back.src = this.url(p);
  };
  Deck.prototype.onLoad = function (f) {
    if (!f.dataset.loading) return;
    delete f.dataset.loading;
    if (f.dataset.token !== String(this.token)) return; // ya se pidió otra diapositiva
    var old = this.front();
    if (old === f) return;
    f.classList.add('front');
    old.classList.remove('front');
    // Vaciar el marco oculto para que no siga sonando ningún vídeo
    setTimeout(function () { if (!old.classList.contains('front')) { old.removeAttribute('src'); delete old.dataset.pos; } }, 300);
  };

  var decks = slides.map(function (s) { return s.classList.contains('deck') ? new Deck(s) : null; });

  // ---- Navegación ----
  function show(n, fromEnd) {
    var prev = i;
    i = Math.max(0, Math.min(slides.length - 1, n));
    var d = decks[i];
    if (d && i !== prev) d.set(fromEnd ? d.n - 1 : 0);
    slides.forEach(function (s, k) { s.classList.toggle('active', k === i); });
    hud.textContent = (i + 1) + ' / ' + slides.length;
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
  }
  function next() {
    var d = decks[i];
    if (d && d.pos < d.n - 1) d.set(d.pos + 1);
    else if (i < slides.length - 1) show(i + 1, false);
    flashHud();
  }
  function prev() {
    var d = decks[i];
    if (d && d.pos > 0) d.set(d.pos - 1);
    else if (i > 0) show(i - 1, true);
    flashHud();
  }
  function flashHud() {
    var d = decks[i];
    hud.textContent = (i + 1) + ' / ' + slides.length + (d ? '  ·  ' + (d.pos + 1) + ' / ' + d.n : '');
    document.body.classList.add('show-hud');
    clearTimeout(hudTimer);
    hudTimer = setTimeout(function () { document.body.classList.remove('show-hud'); }, 1200);
  }
  function fullscreen() {
    var de = document.documentElement;
    if (!document.fullscreenElement) { de.requestFullscreen && de.requestFullscreen().catch(function () {}); }
    else document.exitFullscreen();
  }

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].indexOf(k) >= 0) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].indexOf(k) >= 0) { e.preventDefault(); prev(); }
    else if (k === 'Home') { e.preventDefault(); show(0); }
    else if (k === 'End') { e.preventDefault(); show(slides.length - 1); }
    else if (k === 'f' || k === 'F') { e.preventDefault(); fullscreen(); }
  });
  document.addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    if (e.clientX < window.innerWidth / 3) prev(); else next();
  });
  var x0 = null;
  document.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) { if (dx < 0) next(); else prev(); }
  });
  // Si el foco se va a un marco, recuperarlo para que las flechas sigan llegando aquí
  window.addEventListener('blur', function () { setTimeout(function () { window.focus(); }, 0); });
  document.addEventListener('mousemove', function () {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 2000);
  });

  var start = parseInt(location.hash.slice(1), 10);
  show(isNaN(start) ? 0 : start - 1);
})();
</script>
</body>
</html>
