name: Build image (Hetzner)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-garden-personal-cms
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/igarbayo/garden-personal-cms:latest
            ghcr.io/igarbayo/garden-personal-cms:${{ github.sha }}
          cache-from: type=gha,scope=garden-personal-cms
          cache-to: type=gha,mode=max,scope=garden-personal-cms
