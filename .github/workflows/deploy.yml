name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez. Los runs encolados entre el que está en curso y
# el último se descartan, pero el que ya está desplegando NO se cancela: es
# producción y debe terminar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      - run: pnpm install
        working-directory: src/frontend
      - run: pnpm build
        working-directory: src/frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/frontend/out
      # timeout: 20 min (por defecto 10). Con el dominio proxied por Cloudflare
      # la deployment tarda mucho más en salir de `deployment_queued`.
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          timeout: 1200000
