services:
  - type: web
    name: garden-personal-cms
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    # Root Directory is now repo root (NOT src/backend) because the
    # multi-stage Dockerfile needs access to both src/frontend and src/backend
    region: fra
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ADMIN_USERNAME
        value: ignacio
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: igarbayo/web-personal
      - key: GITHUB_BRANCH
        value: main
      - key: CMS_SUBDOMAIN
        sync: false
